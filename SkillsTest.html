<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table Information Finder</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            color: #222222;
            margin: 0;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #171717, #555555);
            padding: 40px 20px;
            border-bottom: 5px solid #bdbdbd;
            color: white;
        }

        header h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        header p {
            color: #dddddd;
            letter-spacing: 2px;
            font-size: 13px;
        }

        main {
            background: #ffffff;
            max-width: 550px;
            margin: 50px auto;
            padding: 35px;
            border: 2px solid #bdbdbd;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        main h2 {
            color: #222222;
        }

        main p {
            color: #444444;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 20px;
            color: #333333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #999999;
            border-radius: 7px;
            background: #f5f5f5;
            color: #202020;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #777777;
        }

        button {
            margin-top: 22px;
            padding: 12px 25px;
            background: #333333;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        button:hover {
            background: #666666;
        }

        #output {
            background: #eeeeee;
            border-left: 4px solid #777777;
            padding: 20px;
            margin-top: 25px;
            border-radius: 8px;
            text-align: left;
            color: #222222;
        }

        #output p {
            color: #222222;
        }
    </style>
</head>
<body>

    <h1>Periodic Table Information Finder</h1>

    <label for="symbol">Element Symbol:</label>
    <input type="text" id="symbol" placeholder="Enter symbol">

    <button py-click="search_element">Search Element</button>

    <div id="output"></div>

    <script type="py" src="SkillsTest.py"></script>

</body>
</html>
